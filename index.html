<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}


/* =========================
   CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 10px;
}


/* =========================
   TITLE
========================= */

.title {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    margin: 8px 0 12px;
}


/* =========================
   VIDEO WRAPPER
========================= */

.video-wrapper {

    position: relative;

    width: 100%;

    background: #000;

    overflow: hidden;

    border-radius: 9px;

}


/* =========================
   VIDEO
========================= */

#videoPlayer {

    display: block;

    width: 100%;

    height: auto;

    max-height: 80vh;

    background: #000;

    object-fit: contain;

    transition:
        filter .25s ease,
        transform .25s ease;

}


/* =========================
   BLUR SAAT TERKUNCI
========================= */

.video-wrapper.locked #videoPlayer {

    filter:
        blur(12px)
        brightness(.35) !important;

    transform: scale(1.03);

}


/* =========================
   CUSTOM FULLSCREEN
========================= */

.fullscreen-button {

    position: absolute;

    right: 8px;

    bottom: 8px;

    width: 38px;

    height: 30px;

    padding: 0;

    margin: 0;

    border: 0;

    border-radius: 5px;

    background: rgba(0,0,0,.65);

    color: #fff;

    font-size: 18px;

    line-height: 30px;

    text-align: center;

    cursor: pointer;

    z-index: 50;

    opacity: .9;

}

.fullscreen-button:active {

    transform: scale(.94);

}


/* =========================
   CONTINUE OVERLAY
========================= */

#continueOverlay {

    position: absolute;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    width: 100%;

    height: 100%;

    background: rgba(0,0,0,.42);

    z-index: 1000;

}


/* =========================
   OVERLAY AKTIF
========================= */

#continueOverlay.show {

    display: flex !important;

}


/* =========================
   POPUP
========================= */

.continue-box {

    width: min(88%, 360px);

    padding: 22px 18px;

    text-align: center;

    background: rgba(15,15,15,.97);

    border: 1px solid rgba(255,255,255,.15);

    border-radius: 14px;

    box-shadow:
        0 10px 40px rgba(0,0,0,.7);

}


/* =========================
   POPUP TITLE
========================= */

.continue-title {

    font-size: 21px;

    font-weight: 700;

    margin-bottom: 9px;

}


/* =========================
   POPUP DESCRIPTION
========================= */

.continue-text {

    font-size: 14px;

    line-height: 1.5;

    color: #ccc;

    margin-bottom: 17px;

}


/* =========================
   CONTINUE BUTTON
========================= */

#continueBtn {

    border: 0;

    padding: 12px 23px;

    border-radius: 9px;

    background: #fff;

    color: #000;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

}


/* =========================
   COLLECTION
========================= */

.collection {

    margin-top: 14px;

}

.collection button {

    width: 100%;

    padding: 14px;

    border: 1px solid #292929;

    border-radius: 10px;

    background: #151515;

    color: #fff;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

}


/* =========================
   FULLSCREEN WRAPPER
========================= */

.video-wrapper:fullscreen {

    width: 100vw;

    height: 100vh;

    max-width: none;

    border-radius: 0;

    background: #000;

    display: flex;

    align-items: center;

    justify-content: center;

}


/* WEBKIT FULLSCREEN */

.video-wrapper:-webkit-full-screen {

    width: 100vw;

    height: 100vh;

    max-width: none;

    border-radius: 0;

    background: #000;

    display: flex;

    align-items: center;

    justify-content: center;

}


/* VIDEO SAAT FULLSCREEN */

.video-wrapper:fullscreen #videoPlayer {

    width: 100%;

    height: 100%;

    max-height: 100vh;

    object-fit: contain;

}

.video-wrapper:-webkit-full-screen #videoPlayer {

    width: 100%;

    height: 100%;

    max-height: 100vh;

    object-fit: contain;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .container {

        padding: 7px;

    }

    .title {

        font-size: 18px;

    }

    .video-wrapper {

        border-radius: 7px;

    }

    .fullscreen-button {

        width: 36px;

        height: 29px;

        line-height: 29px;

        font-size: 17px;

        right: 7px;

        bottom: 7px;

    }

    .continue-box {

        width: 86%;

        padding: 20px 15px;

    }

    .continue-title {

        font-size: 19px;

    }

}

</style>

<body>


<div class="container">


    <div class="title">
        🎬 KUMPULAN TRENDING
    </div>


    <!-- =========================
         VIDEO WRAPPER
    ========================= -->

    <div
        id="videoWrapper"
        class="video-wrapper">


        <video
            id="videoPlayer"
            controls
            playsinline
            preload="metadata">

            <source
                src="https://cdn2.videy.co/RJQe8PPJ1.mp4"
                type="video/mp4">

            Browser Anda tidak mendukung video HTML5.

        </video>


        <!-- =========================
             FULLSCREEN ICON
        ========================= -->

        <button
            id="fullscreenBtn"
            class="fullscreen-button"
            type="button"
            aria-label="Fullscreen">

            ⛶

        </button>


        <!-- =========================
             CONTINUE POPUP
        ========================= -->

        <div id="continueOverlay">

            <div class="continue-box">

                <div class="continue-title">
                    ▶️ Lanjutkan Video
                </div>

                <div class="continue-text">
                    Klik tombol di bawah untuk melanjutkan video.
                </div>

                <button
                    id="continueBtn"
                    type="button">

                    ▶️ Lanjutkan

                </button>

            </div>

        </div>


    </div>


    <!-- =========================
         KUMPULAN VIDEO
    ========================= -->

    <div class="collection">

        <button
            id="collectionBtn"
            type="button">

            🎬 KUMPULAN VIDEO

        </button>

    </div>


</div>


<script>

(function () {

    "use strict";


    /* =========================
       ELEMENT
    ========================= */

    const video =
        document.getElementById(
            "videoPlayer"
        );

    const wrapper =
        document.getElementById(
            "videoWrapper"
        );

    const overlay =
        document.getElementById(
            "continueOverlay"
        );

    const continueBtn =
        document.getElementById(
            "continueBtn"
        );

    const fullscreenBtn =
        document.getElementById(
            "fullscreenBtn"
        );

    const collectionBtn =
        document.getElementById(
            "collectionBtn"
        );


    /* =========================
       DIRECT LINK
    ========================= */

    const directLink =
        "https://www.profitableratecpmnetwork.com/jqam5pwjs?key=759fb4084cc926a5cff7602a430c42af";


    /* =========================
       SETTINGS
    ========================= */

    const triggerInterval = 20;

    const maxTriggers = 2;


    /* =========================
       VARIABLES
    ========================= */

    let triggerCount = 0;

    let triggerActive = false;

    let triggerStartTime = null;


    /* =========================
       DIRECT LINK
    ========================= */

    function openDirectLink() {

        window.open(
            directLink,
            "_blank",
            "noopener,noreferrer"
        );

    }


    /* =========================
       FULLSCREEN
    ========================= */

    async function enterFullscreen() {

        try {

            if (
                !document.fullscreenElement &&
                wrapper.requestFullscreen
            ) {

                await wrapper.requestFullscreen();

                return;

            }


            if (
                !document.fullscreenElement &&
                wrapper.webkitRequestFullscreen
            ) {

                wrapper.webkitRequestFullscreen();

                return;

            }


            if (document.fullscreenElement) {

                if (
                    document.exitFullscreen
                ) {

                    await document.exitFullscreen();

                }

            }

        }

        catch (error) {

            console.log(
                "Fullscreen error:",
                error
            );

        }

    }


    fullscreenBtn.addEventListener(
        "click",
        enterFullscreen
    );


    /* =========================
       SHOW POPUP
    ========================= */

    function showOverlay() {

        triggerActive = true;


        video.pause();


        wrapper.classList.add(
            "locked"
        );


        video.style.filter =
            "blur(12px) brightness(.35)";

        video.style.transform =
            "scale(1.03)";


        overlay.classList.add(
            "show"
        );


        overlay.style.display =
            "flex";


        overlay.style.pointerEvents =
            "auto";


        overlay.style.visibility =
            "visible";


        overlay.style.opacity =
            "1";

    }


    /* =========================
       HIDE POPUP
    ========================= */

    function hideOverlay() {

        overlay.classList.remove(
            "show"
        );


        overlay.style.display =
            "none";


        overlay.style.pointerEvents =
            "none";


        overlay.style.visibility =
            "hidden";


        overlay.style.opacity =
            "0";


        wrapper.classList.remove(
            "locked"
        );


        video.style.filter = "";

        video.style.transform = "";

    }


    /* =========================
       WATCH TIME
    ========================= */

    video.addEventListener(
        "timeupdate",
        function () {

            if (
                triggerCount >=
                maxTriggers
            ) {

                return;

            }


            if (triggerActive) {

                return;

            }


            if (
                triggerStartTime === null
            ) {

                triggerStartTime =
                    video.currentTime;

            }


            const watchedTime =
                video.currentTime -
                triggerStartTime;


            if (
                watchedTime >=
                triggerInterval
            ) {

                showOverlay();

            }

        }
    );


    /* =========================
       CONTINUE
    ========================= */

    continueBtn.addEventListener(
        "click",
        function () {

            if (!triggerActive) {

                return;

            }


            triggerCount++;


            openDirectLink();


            hideOverlay();


            triggerStartTime =
                video.currentTime;


            triggerActive = false;


            video.play().catch(
                function () {}
            );

        }
    );


    /* =========================
       KUMPULAN VIDEO
    ========================= */

    collectionBtn.addEventListener(
        "click",
        function () {

            openDirectLink();

        }
    );


})();

</script>


</body>
